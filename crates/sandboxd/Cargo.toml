[package]
name = "sandboxd"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "sandboxfs"
path = "src/main.rs"

[dependencies]
backend = { path = "../backend" }
# Swapped to the git source for release builds; see packaging/package.sh.
backend-cfs = { path = "../backend-cfs" }
backend-fskit = { path = "../backend-fskit" }
backend-hardlink = { path = "../backend-hardlink" }
libc = "0.2"
rustc-hash = "2.1"

[target.'cfg(target_os = "macos")'.dependencies]
metrics = { path = "../metrics" }
